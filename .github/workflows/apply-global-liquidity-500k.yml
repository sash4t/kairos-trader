name: Apply global 500k liquidity floor

on:
  push:
    branches:
      - feature/global-liquidity-500k

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-liquidity-500k
          fetch-depth: 0

      - name: Apply exact liquidity changes
        run: |
          python - <<'PY'
          from pathlib import Path

          agent = Path('src/lib/agent.server.ts')
          text = agent.read_text()
          old = "const MIN_24H_VOLUME = 1_500_000;\nconst RSI_MIN_24H_VOLUME = 1_000_000;"
          assert old in text, 'agent constants did not match expected source'
          text = text.replace(old, "const MIN_24H_VOLUME = 500_000;", 1)
          old_rsi = "+x.ctx.dayNtlVlm > RSI_MIN_24H_VOLUME"
          assert old_rsi in text, 'agent RSI floor reference not found'
          text = text.replace(old_rsi, "+x.ctx.dayNtlVlm > MIN_24H_VOLUME", 1)
          agent.write_text(text)

          paper = Path('src/lib/paperEngineOptimized.ts')
          text = paper.read_text()
          old = "const LIQUIDITY_FLOOR = 1_500_000;\nconst RSI_LIQUIDITY_FLOOR = 1_000_000;"
          assert old in text, 'paper constants did not match expected source'
          text = text.replace(old, "const LIQUIDITY_FLOOR = 500_000;", 1)
          old_rsi = "{ minVolume: RSI_LIQUIDITY_FLOOR, includeMajors: true }"
          assert old_rsi in text, 'paper RSI floor reference not found'
          text = text.replace(old_rsi, "{ minVolume: LIQUIDITY_FLOOR, includeMajors: true }", 1)
          paper.write_text(text)
          PY

      - name: Verify exact scope
        run: |
          grep -n "MIN_24H_VOLUME = 500_000" src/lib/agent.server.ts
          grep -n "rsiLiquid.*MIN_24H_VOLUME" src/lib/agent.server.ts
          grep -n "LIQUIDITY_FLOOR = 500_000" src/lib/paperEngineOptimized.ts
          grep -n "minVolume: LIQUIDITY_FLOOR, includeMajors: true" src/lib/paperEngineOptimized.ts
          ! grep -R "RSI_MIN_24H_VOLUME\|RSI_LIQUIDITY_FLOOR" src/lib/agent.server.ts src/lib/paperEngineOptimized.ts
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agent.server.ts src/lib/paperEngineOptimized.ts
          git commit -m "Set global 24h liquidity floor to 500k"
          git push origin HEAD:feature/global-liquidity-500k
